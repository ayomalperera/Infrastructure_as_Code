---



- name: Create Apache Virtual Hosts
  hosts: webservers
  become: yes

  tasks:
    - name: Ensure Apache is installed
      apt:
        name: apache2
        state: present
        update_cache: yes

    - name: Enable required Apache modules
      apache2_module:
        name: "{{ item }}"
        state: present
      loop:
        - headers
        - rewrite
        - http2
      notify: Restart Apache

    - name: Create web root parent directory
      file:
        path: "{{ item.document_root | dirname }}"
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"
      loop: "{{ apache_vhosts }}"

    - name: Clone application repository
      git:
        repo: "{{ item.git_repo }}"
        dest: "{{ item.document_root }}"
        version: "{{ item.git_branch }}"
        update: yes
        force: yes
      loop: "{{ apache_vhosts }}"





    - name: Create vhost configuration
      template:
        src: templates/vhost.conf.j2
        dest: "/etc/apache2/sites-available/{{ item.server_name }}.conf"
        owner: root
        group: root
        mode: '0644'
      loop: "{{ apache_vhosts }}"
      notify: Restart Apache

    - name: Enable site
      command: a2ensite {{ item.server_name }}.conf
      args:
        creates: "/etc/apache2/sites-enabled/{{ item.server_name }}.conf"
      loop: "{{ apache_vhosts }}"
      notify: Restart Apache

  handlers:
    - name: Restart Apache
      service:
        name: apache2
        state: restarted
